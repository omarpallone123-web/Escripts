<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wave</title>
<style>
:root{--bg:#f4f9ff;--fg:#0b1f3a;--mut:#5b7190;--card:rgba(255,255,255,.72);--bd:rgba(20,80,160,.14);--a:#1f8bff;--b:#00d4c8;--w1:#1f8bff;--w2:#00d4c8;--w3:#6a7bff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050d1c;--fg:#e8f2ff;--mut:#8aa3c4;--card:rgba(14,28,52,.65);--bd:rgba(120,180,255,.16);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050d1c;--fg:#e8f2ff;--mut:#8aa3c4;--card:rgba(14,28,52,.65);--bd:rgba(120,180,255,.16);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 40% at 80% 0%,color-mix(in srgb,var(--a) 28%,transparent),transparent),radial-gradient(50% 40% at 0% 30%,color-mix(in srgb,var(--b) 22%,transparent),transparent)}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:48px 20px 160px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.logo svg{width:34px;height:34px}
h1{font-size:clamp(46px,14vw,84px);line-height:1;margin:44px 0 14px;letter-spacing:-2px;background:linear-gradient(110deg,var(--a),var(--b),var(--w3));-webkit-background-clip:text;background-clip:text;color:transparent}
p.lead{font-size:18px;line-height:1.5;color:var(--mut);margin:0 0 32px;max-width:460px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px -25px rgba(31,139,255,.45)}
.drop{display:block;border:2px dashed var(--bd);border-radius:18px;padding:34px 16px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 8%,transparent);transform:translateY(-2px)}
.drop b{display:block;font-size:17px;margin-top:8px}
.drop span{color:var(--mut);font-size:14px}
.drop svg{width:38px;height:38px;color:var(--a)}
input[type=file]{display:none}
.res{display:none;margin-top:18px}
.res.show{display:block}
label{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:600}
.row{display:flex;gap:8px;margin-top:8px}
input[type=text]{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:transparent;color:var(--fg);font:14px ui-monospace,Menlo,monospace}
button{border:0;border-radius:14px;padding:0 18px;font-weight:600;font-size:15px;color:#fff;background:linear-gradient(110deg,var(--a),var(--b));cursor:pointer;min-height:46px}
button.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.msg{margin-top:12px;font-size:14px;color:var(--mut);min-height:20px}
.sec{margin-top:26px}
.wv{position:fixed;left:0;right:0;bottom:0;height:140px;z-index:0;pointer-events:none}
.wv svg{position:absolute;bottom:0;width:200%;height:100%}
.wv path{animation:mv linear infinite}
.wv .p1{animation-duration:14s;opacity:.35}.wv .p2{animation-duration:9s;opacity:.5}.wv .p3{animation-duration:6s;opacity:.7}
@keyframes mv{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.wv path{animation:none}}
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <div class="logo">
    <svg viewBox="0 0 40 40" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f8bff"/><stop offset="1" stop-color="#00d4c8"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#g)"/><path d="M6 22c4-8 7-8 9 0s5 8 9 0 6-8 10 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
    Wave
  </div>
  <h1>Wave</h1>
  <p class="lead">Carica un file e ricevi una stringa per ritrovarlo. Semplice come un’onda.</p>

  <div class="card">
    <label class="drop" id="drop" for="f">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <b>Tocca per caricare un file</b>
      <span>oppure trascinalo qui</span>
    </label>
    <input type="file" id="f">
    <div class="msg" id="msg"></div>

    <div class="res" id="res">
      <label>La tua load string</label>
      <div class="row">
        <input type="text" id="ls" readonly>
        <button id="cp">Copia</button>
      </div>
    </div>

    <div class="sec">
      <label>Carica da load string</label>
      <div class="row">
        <input type="text" id="in" placeholder="Incolla qui la load string">
        <button class="g" id="go">Apri</button>
      </div>
    </div>
  </div>
</main>

<div class="wv" aria-hidden="true">
  <svg class="p1" viewBox="0 0 1440 140" preserveAspectRatio="none"><path class="p1" fill="var(--w3)" d="M0 70q90-50 180 0t180 0 180 0 180 0 180 0 180 0 180 0 180 0V140H0z"/></svg>
  <svg viewBox="0 0 1440 140" preserveAspectRatio="none"><path class="p2" fill="var(--w2)" d="M0 80q90-50 180 0t180 0 180 0 180 0 180 0 180 0 180 0 180 0V140H0z"/></svg>
  <svg viewBox="0 0 1440 140" preserveAspectRatio="none"><path class="p3" fill="var(--w1)" d="M0 95q90-45 180 0t180 0 180 0 180 0 180 0 180 0 180 0 180 0V140H0z"/></svg>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var msg=$('msg'),res=$('res'),ls=$('ls'),drop=$('drop');
  var assets=null;
  try{
    if(window.claude&&claude.use){claude.use('assets').then(function(a){assets=a}).catch(function(){})}
  }catch(e){}

  function site(){
    try{var o=location.origin;if(o&&o!=='null')return o+location.pathname.replace(/[^\/]*$/,'')}catch(e){}
    return '';
  }
  function toString_(u){
    var base='';try{base=location.origin&&location.origin!=='null'?location.origin:''}catch(e){}
    return base+u;
  }

  async function up(file){
    if(!file)return;
    res.classList.remove('show');
    if(!assets){msg.textContent='Il caricamento è disponibile solo per il proprietario della pagina.';return}
    msg.textContent='Caricamento di '+file.name+'…';
    try{
      var r=await assets.upload(file);
      ls.value=toString_(r.url);
      res.classList.add('show');
      msg.textContent='Fatto ✓ '+file.name;
    }catch(e){
      msg.textContent='Errore: '+((e&&e.message)||'caricamento non riuscito');
    }
  }

  $('f').addEventListener('change',function(e){up(e.target.files[0])});
  ['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('on')})});
  ['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('on')})});
  drop.addEventListener('drop',function(e){up(e.dataTransfer.files[0])});

  $('cp').addEventListener('click',async function(){
    try{await navigator.clipboard.writeText(ls.value);msg.textContent='Copiata negli appunti ✓'}
    catch(e){ls.select();msg.textContent='Seleziona e copia la stringa.'}
  });

  $('go').addEventListener('click',function(){
    var v=$('in').value.trim();
    if(!v){msg.textContent='Incolla prima una load string.';return}
    if(!/\/_blob\/[0-9a-f]{32}/.test(v)){msg.textContent='Load string non valida.';return}
    try{window.open(v,'_blank','noopener')}catch(e){msg.textContent='Impossibile aprire il file.'}
  });
})();
</script>
</body>
</html>
